apiVersion: equity.module/v1
id: builtin/regulatory-compliance
name: 行政监管与信用
version: 0.1.0
kind: collect
stageHint: risk
scope: company
description: 收集行政处罚、税务/海关信用、经营异常与监管问询。
status: draft
provenance:
  author: ai-draft
  origin: agent
inputs:
  - type: company.identity
    onMissing: block
references:
  - type: business.segment
outputs:
  - type: regulatory.compliance
    typeVersion: 1
params:
  - key: yearsBack
    type: integer
    default: 3
    min: 1
    max: 10
    label: 回溯年限
render:
  system: ../_shared/_system.md
  task: prompts/collect.md
  tail: ../_shared/_tail.md
gates:
  - id: schema
    type: schema
  - id: coverage
    type: coverage
    config:
      min: 0.7
review:
  mode: single
  maxRounds: 1
budget:
  toolCallsPerUnit: 16
  tokensPerUnit: 45000
  wallClockMinPerUnit: 25
tools:
  - web_search
  - web_fetch
  - equity_record
compat:
  kernel: ">=1.0 <2"
