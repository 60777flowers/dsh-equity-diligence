apiVersion: equity.module/v1
id: builtin/market-landscape
name: 行业空间与竞争格局
version: 0.1.0
kind: collect
stageHint: market
scope: company
description: 梳理行业规模、增速、份额、竞争格局与政策。
status: draft
provenance:
  author: ai-draft
  origin: agent
inputs:
  - type: business.segment
    onMissing: block
outputs:
  - type: market.landscape
    typeVersion: 1
params:
  - key: yearsBack
    type: integer
    default: 3
    min: 1
    max: 10
    label: 回溯年限
render:
  system: ../_shared/_system.md
  task: prompts/collect.md
  tail: ../_shared/_tail.md
gates:
  - id: schema
    type: schema
  - id: coverage
    type: coverage
    config:
      min: 0.7
review:
  mode: single
  maxRounds: 1
budget:
  toolCallsPerUnit: 20
  tokensPerUnit: 60000
  wallClockMinPerUnit: 30
tools:
  - web_search
  - web_fetch
  - equity_record
compat:
  kernel: ">=1.0 <2"
