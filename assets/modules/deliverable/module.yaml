apiVersion: equity.module/v1
id: builtin/deliverable
name: 报告与附表
version: 0.1.0
kind: deliver
stageHint: delivery
scope: project
description: 从底稿构建管理层摘要、综合工作簿、7+N 专项、底稿包与 QA。
status: draft
provenance:
  author: ai-draft
  origin: agent
inputs:
  - type: all
    onMissing: block
outputs:
  - type: report.deliverable
    typeVersion: 1
  - type: dd.request_list
    typeVersion: 1
params:
  - key: template
    type: string
    default: standard
    enum:
      - quick
      - standard
      - deep
    label: 交付模板
  - key: include7N
    type: boolean
    default: true
    label: 是否生成 7+N 专项
render:
  system: ../_shared/_system.md
  task: prompts/collect.md
  tail: ../_shared/_tail.md
gates:
  - id: schema
    type: schema
review:
  mode: none
  maxRounds: 0
budget:
  toolCallsPerUnit: 0
  tokensPerUnit: 20000
  wallClockMinPerUnit: 30
tools:
  - web_search
  - web_fetch
  - equity_record
compat:
  kernel: ">=1.0 <2"
