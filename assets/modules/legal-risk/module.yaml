apiVersion: equity.module/v1
id: builtin/legal-risk
name: 司法风险
version: 0.1.0
kind: collect
stageHint: risk
scope: company
description: 收集诉讼、被执行、失信、股权冻结与破产线索。
status: draft
provenance:
  author: ai-draft
  origin: agent
inputs:
  - type: company.identity
    onMissing: block
references:
  - type: ownership.chain
  - type: org.people
outputs:
  - type: legal.risk
    typeVersion: 1
params:
  - key: yearsBack
    type: integer
    default: 5
    min: 1
    max: 10
    label: 回溯年限
render:
  system: ../_shared/_system.md
  task: prompts/collect.md
  tail: ../_shared/_tail.md
gates:
  - id: schema
    type: schema
  - id: coverage
    type: coverage
    config:
      min: 0.7
review:
  mode: single
  maxRounds: 1
budget:
  toolCallsPerUnit: 20
  tokensPerUnit: 60000
  wallClockMinPerUnit: 30
tools:
  - web_search
  - web_fetch
  - equity_record
compat:
  kernel: ">=1.0 <2"
