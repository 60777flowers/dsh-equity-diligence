apiVersion: equity.module/v1
id: builtin/customers-orders
name: 客户、订单与招投标
version: 0.1.0
kind: collect
stageHint: business
scope: company
description: 梳理前五大客户、集中度、认证阶段、订单与中标记录。
status: draft
provenance:
  author: ai-draft
  origin: agent
inputs:
  - type: business.segment
    onMissing: block
references:
  - type: related.parties
  - type: ownership.chain
outputs:
  - type: valuechain.parties
    typeVersion: 1
params:
  - key: topN
    type: integer
    default: 5
    min: 3
    max: 10
    label: 前 N 大客户
render:
  system: ../_shared/_system.md
  task: prompts/collect.md
  tail: ../_shared/_tail.md
gates:
  - id: schema
    type: schema
  - id: coverage
    type: coverage
    config:
      min: 0.7
review:
  mode: single
  maxRounds: 1
budget:
  toolCallsPerUnit: 20
  tokensPerUnit: 60000
  wallClockMinPerUnit: 30
tools:
  - web_search
  - web_fetch
  - equity_record
compat:
  kernel: ">=1.0 <2"
