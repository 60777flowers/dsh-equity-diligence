apiVersion: equity.module/v1
id: builtin/supply-capacity
name: 供应链、产能与成本
version: 0.1.0
kind: collect
stageHint: business
scope: company
description: 梳理供应商、单一来源、产能/稼动率与成本结构。
status: draft
provenance:
  author: ai-draft
  origin: agent
inputs:
  - type: business.segment
    onMissing: block
references:
  - type: related.parties
outputs:
  - type: supply.capacity
    typeVersion: 1
params:
  - key: includeCost
    type: boolean
    default: true
    label: 是否拆成本结构
render:
  system: ../_shared/_system.md
  task: prompts/collect.md
  tail: ../_shared/_tail.md
gates:
  - id: schema
    type: schema
  - id: coverage
    type: coverage
    config:
      min: 0.7
review:
  mode: single
  maxRounds: 1
budget:
  toolCallsPerUnit: 20
  tokensPerUnit: 60000
  wallClockMinPerUnit: 30
tools:
  - web_search
  - web_fetch
  - equity_record
compat:
  kernel: ">=1.0 <2"
